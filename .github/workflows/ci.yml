name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [14, 16, 17, 18]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # service containers can't take server flags, and the slot test needs wal_level=logical
      - run: >-
          docker run -d --name pg -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust
          postgres:${{ matrix.postgres }} -c wal_level=logical
      - run: until docker exec pg pg_isready -U postgres; do sleep 1; done
      - run: go vet ./...
      - run: go test -race ./...
        env:
          SLOTWATCH_TEST_DSN: postgres://postgres@localhost:5432/postgres?sslmode=disable

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
